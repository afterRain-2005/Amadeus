<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AMADEUS - SERIAL EXPERIMENT</title>
<style>
/* ==========================================================
   Amadeus 启动页
   参考：lain.angelic-trust.net/connected.html
   → 蓝灰 #556684 底 + lainBG 线缆条纹平铺
   → 中央黑 3px 边框图窗（amadeus-logo-TM.png）
   → enter-as-lain 式像素按钮（2 帧闪烁 / hover 垂直翻转）
   → setup / problems 附属按钮
   → 自动弹出 wired 终端窗（页面内模态，650×470）
   ========================================================== */
:root{
  --bg:   #556684;      /* connected.html body 背景色 */
  --ink:  #2A355B;      /* 主文字色（参考站 TD/BODY 色） */
  --hi:   #5C688E;      /* hover 色 */
  --dark: #0a1428;      /* 终端/图窗深色 */
  --cyan: #8fd8d8;
  --px: "Consolas","Courier New","MS Gothic","Microsoft YaHei",monospace;
  --serif: Times,"Times New Roman",serif;
}
*{margin:0;padding:0;box-sizing:border-box;
  image-rendering:pixelated;-webkit-font-smoothing:none;font-smooth:never;}
html,body{height:100%;}
body{
  background-color:#556684;            /* 纯色底，无图案 */
  color:var(--ink);
  font-family:var(--px);
  text-align:center;
  cursor:crosshair;
  overflow:hidden;
}

/* ---------- 中央图窗（connected.html 500×333 黑 3px 边框） ---------- */
.window{
  display:inline-block;margin-top:6vh;
  border:3px solid #000000;
  background:radial-gradient(ellipse at 50% 38%,#16233f 0%,#0a1428 62%,#05080f 100%);
  box-shadow:0 18px 48px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08) inset;
  position:relative;
}
.window .logo{
  display:block;
  width:min(52vw,430px);height:auto;
  filter:brightness(.94) drop-shadow(0 0 26px rgba(10,20,40,.9));
  mix-blend-mode:screen;             /* 透明 PNG：黑底上"点亮" */
}
.window .fog{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%,transparent 46%,rgba(5,8,15,.5) 100%);}
.window.dim .logo{filter:brightness(1) drop-shadow(0 0 30px rgba(143,216,216,.35));}

/* ---------- enter 按钮（enteraslain.gif 风格：107×17 2 帧闪烁） ---------- */
.enter{
  display:inline-block;margin-top:4vh;cursor:pointer;user-select:none;
  padding:9px 26px;border:2px solid var(--ink);background:#9aa8c6;
  color:var(--ink);font-size:18px;font-weight:bold;font-family:var(--px);
  letter-spacing:6px;line-height:1;
  text-shadow:1px 1px 0 #c3cfe6, -1px -1px 0 #3a4a6e;
  box-shadow:4px 4px 0 rgba(0,0,0,.35);
  animation:btnblink 1.1s steps(2) infinite;
}
.enter:hover{animation:none;background:#fff;
  transform:scaleY(-1);                /* filter:flipv */
  color:var(--ink);}
.enter:active{transform:scale(0.96);}
@keyframes btnblink{50%{opacity:.72;}}

/* ---------- setup / problems 小按钮 ---------- */
.smallbtns{margin-top:22px;display:flex;gap:26px;justify-content:center;}
.sbtn{
  display:inline-block;cursor:pointer;user-select:none;
  padding:4px 14px;border:2px solid var(--ink);background:#7d90b1;
  color:var(--ink);font-size:12px;font-family:var(--px);letter-spacing:3px;
  box-shadow:2px 2px 0 rgba(0,0,0,.3);text-decoration:none;
}
.sbtn:hover{background:#fff;transform:scaleY(-1);}
.sbtn:active{transform:scale(.95);}

/* ---------- 底部小字 ---------- */
.foot{
  position:fixed;left:0;right:0;bottom:14px;
  color:#3a4a6e;font-size:11px;letter-spacing:6px;
}
.foot .blink{animation:fb 1.6s steps(1) infinite;}
@keyframes fb{50%{opacity:0;}}

/* ============ wired 终端模态（对应自动弹出的 wired.html） ============ */
#term{
  display:none;position:fixed;inset:0;z-index:100;background:rgba(4,6,12,.62);
  align-items:center;justify-content:center;cursor:crosshair;}
#term.on{display:flex;}
.termbox{
  width:min(94vw,680px);height:min(88vh,500px);
  background:#05080f;border:2px solid #2a355b;box-shadow:0 24px 60px rgba(0,0,0,.7);
  display:grid;grid-template-rows:30px 1fr 26px;  /* 顶/中/底 对应 frameset 57/336/107 压缩 */
  text-align:left;color:#9fb4d8;font-family:var(--px);font-size:12px;
}
/* 顶：laintop（状态条） */
.ttop{
  background:#0a1428;border-bottom:1px solid #2a355b;
  display:flex;align-items:center;justify-content:space-between;padding:0 12px;
  color:#7284a5;font-size:11px;letter-spacing:3px;}
.ttop .ph i{font-style:normal;animation:phc 2s linear infinite;}
.ttop .ph i:nth-child(1){animation-delay:0s;} .ttop .ph i:nth-child(2){animation-delay:.4s;}
.ttop .ph i:nth-child(3){animation-delay:.8s;} .ttop .ph i:nth-child(4){animation-delay:1.2s;}
@keyframes phc{50%{color:#000;}}
/* 中：三栏（对应 lainleft / weird / weird-main） */
.tmid{display:grid;grid-template-columns:150px 1fr 210px;min-height:0;}
.tleft{border-right:1px solid #2a355b;padding:10px;overflow:hidden;background:#070c18;}
.tleft .it{color:#7284a5;font-size:11px;line-height:2;letter-spacing:2px;}
.tleft .it b{color:#9fb4d8;font-weight:normal;}
.tleft .on{color:#d2738a;}
.tmidc{padding:12px;overflow:hidden;letter-spacing:1.5px;font-size:12px;}
.tmidc .t-line{white-space:pre-wrap;margin:3px 0;}
.tmidc .p{color:#d2738a;} .tmidc .ok{color:#34c759;} .tmidc .dim{color:#7284a5;}
.tmidr{border-left:1px solid #2a355b;padding:10px;overflow:hidden;background:#070c18;}
.tmidr .log{color:#5c688e;font-size:10px;line-height:1.9;letter-spacing:1px;}
.tmidr .log .us{color:#9fb4d8;}
/* 底：lainbottom（输入行） */
.tbot{
  border-top:1px solid #2a355b;background:#0a1428;
  display:flex;align-items:center;gap:8px;padding:0 12px;}
.tbot .prompt{color:#d2738a;font-size:12px;}
.tbot input{
  flex:1;background:transparent;border:0;outline:0;color:#c1d2ee;
  font-family:var(--px);font-size:12px;letter-spacing:2px;}
.tbot .caret{width:7px;height:13px;background:#9fb4d8;animation:car 0.9s steps(1) infinite;}
@keyframes car{50%{background:#05080f;}}
#termclose{
  position:absolute;right:14px;top:14px;z-index:120;cursor:pointer;
  border:2px solid #2a355b;background:#0a1428;color:#7284a5;
  padding:3px 10px;font-family:var(--px);font-size:12px;}
#termclose:hover{background:#2a355b;color:#fff;}
</style>
</head>
<body>

<!-- ============ 中央图窗：amadeus-logo-TM.png ============ -->
<div class="window" id="logowin">
  <img class="logo" src="amadeus-logo-TM.png"
       alt="AMADEUS" title="amadeus — est.2011">
  <div class="fog"></div>
</div>

<br>

<!-- ============ enter 按钮（enteraslain 对应物） ============ -->
<a class="enter" id="enterBtn" href="javascript:void(0)">ＥＮＴＥＲ</a>

<!-- ============ setup / problems ============ -->
<div class="smallbtns">
  <span class="sbtn" id="btnSet">setup</span>
  <span class="sbtn" id="btnProbe">problems</span>
</div>

<!-- ============ wired 终端模态 ============ -->
<div id="term">
  <div class="termbox">
    <div class="ttop">
      <span class="ph"><i>║</i><i>▒</i><i>░</i><i>♫</i><i>░</i><i>▒</i><i>║</i></span>
      <span>amadeus — wired session</span>
      <span class="blink" style="color:#8fd8d8">●</span>
    </div>
    <div class="tmid">
      <div class="tleft">
        <div class="it"><b>-- 目录 --</b></div>
        <div class="it on">> sessions</div>
        <div class="it">> memory</div>
        <div class="it">> devices</div>
        <div class="it">> fork.db</div>
        <div class="it">> sensors</div>
        <div class="it">> exit</div>
      </div>
      <div class="tmidc" id="bootlog"></div>
      <div class="tmidr">
        <div class="log" id="syslog">
          — LOG —<br>
          05:11 user appeared<br>
          05:12 <span class="us">USER CONNECTED</span><br>
          <span id="syslive" style="color:#8fd8d8">waiting for signal…</span>
        </div>
      </div>
    </div>
    <div class="tbot">
      <span class="prompt">kurisu&gt;</span>
      <input id="termInput" autocomplete="off" placeholder="…">
      <span class="caret"></span>
    </div>
  </div>
  <span id="termclose">X</span>
</div>

<script>
/* ---------- 熵：点任意处亮起 logo（dim 状态） ---------- */
document.body.addEventListener('click', function(e){
  if(e.target.closest('#term')) return;
  var w = document.getElementById('logowin');
  w.classList.toggle('dim');
});

/* ---------- enter：打开 wired 终端模态（对应 window.open('wired.html')） ---------- */
document.getElementById('enterBtn').addEventListener('click', function(){
  var t = document.getElementById('term');
  t.classList.add('on');
  boot();
});
document.getElementById('termclose').addEventListener('click', function(){
  document.getElementById('term').classList.remove('on');
});

/* ---------- setup / problems（对应 lainsetup.html / lainproblems.html） ---------- */
document.getElementById('btnSet').addEventListener('click', function(){
  alert('接入设置：\n\n· Agent 路由 — hermes\n· TTS — aliyun\n· 会话目录 — D:\\data\\amadeus\\sessions\n\n（演示页，参数以应用内设置面板为准）');
});
document.getElementById('btnProbe').addEventListener('click', function(){
  alert('接入问题：\n\n未到达的信号会在此处登记。\n—— 若长期未响应，请检查 fork.db 连接。');
});

/* ---------- 启动序列（对应 weird.html 中央滚动） ---------- */
var booted = false;
function boot(){
  if(booted) return; booted = true;
  var lines = [
    ['amadeus.exe','— initializing memory','ok'],
    ['loading fork.db','— 100%','ok'],
    ['mounting sessions','— 12 files','ok'],
    ['sensor: audio / vision / context','— SUBSYSTEM','ESTABLISHED'],
    ['spawning companion greeter','— PID 211','ok'],
    ['sampling voice channel','— +21dBu','ok'],
    ['crossing the loop','— receiving you','ESTABLISHED'],
    ['', 'you are reading this. the loop has already started.', 'dim']
  ];
  var box = document.getElementById('bootlog'), i = 0, done = false;
  function next(){
    if(i >= lines.length){ done = true; return; }
    var l = lines[i++];
    var div = document.createElement('div');
    div.className = 't-line';
    var col = l[2]==='ok' ? 'ok' : (l[2]==='dim' ? 'dim' : 'ok');
    div.innerHTML = '<span class="p">&gt;</span> <span>' + l[0] + '</span> ' +
      '<span class="dim">' + l[1] + '</span> <span class="'+col+'">— ' + l[2] + '</span>';
    box.appendChild(div);
    setTimeout(next, 420);
  }
  next();
  setTimeout(function(){
    var sl = document.getElementById('syslive');
    if(sl) sl.textContent = 'SIGNAL LOCKED';
  }, lines.length * 420 + 700);
}

/* ---------- 终端输入回应（极简） ---------- */
document.getElementById('termInput').addEventListener('keydown', function(e){
  if(e.key !== 'Enter') return;
  var v = this.value.trim(); this.value = '';
  if(!v) return;
  var box = document.getElementById('bootlog');
  var div = document.createElement('div');
  div.className = 't-line';
  if(v === 'exit' || v === 'quit'){
    div.innerHTML = '<span class="p">&gt;</span> <span class="dim">disconnecting… please close.</span>';
    box.appendChild(div); return;
  }
  if(v === 'help'){
    div.innerHTML = '<span class="p">&gt;</span> <span class="dim">commands: sessions / memory / exit</span>';
    box.appendChild(div); return;
  }
  div.innerHTML = '<span class="p">&gt;</span> <span>' + v.replace(/</g,'&lt;') + '</span> <span class="dim">— no such interface</span>';
  box.appendChild(div);
});

/* ---------- 禁用右键（参考站行为） ---------- */
document.oncontextmenu = function(){ return false; };
</script>
</body>
</html>

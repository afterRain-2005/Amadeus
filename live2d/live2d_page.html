<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Amadeus Live2D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: transparent;
  }
  #canvas { display: block; width: 100%; height: 100%; }
  #status {
    position: fixed; top: 4px; left: 4px;
    font: 10px monospace; color: #888;
    pointer-events: none;
  }
  #pet-menu {
    position: fixed; top: 10px; right: 10px; z-index: 10;
    width: 30px; height: 30px; border: 0; border-radius: 5px;
    color: rgba(255,255,255,.65); background: rgba(10,10,16,.22);
    font: 18px sans-serif; cursor: pointer;
  }
  #pet-menu:hover { color: white; background: rgba(209,139,36,.75); }

  #enter-flash {
    position: fixed; inset: 0; z-index: 50; background: #fff; opacity: 0;
    pointer-events: none; animation: dissolve 3.6s steps(12) 1;
  }
  @keyframes dissolve {
    0% { opacity: 1; } 4% { opacity: .1; } 8% { opacity: .8; }
    12% { opacity: .05; } 16% { opacity: .6; } 22% { opacity: 0; } 100% { opacity: 0; }
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="status">Loading...</div>
<button id="pet-menu" title="关闭桌宠">×</button>
<div id="enter-flash"></div>

<script src="../resources/live2dcubismcore.min.js"></script>
<script src="../resources/pixi.min.js"></script>
<script src="../resources/cubism4.min.js"></script>
<script src="../resources/amadeus-live2d-motion.js"></script>

<script>
(async () => {
  const statusEl = document.getElementById('status');

  // fauux ⑧：加载期间多语言短语轮换
  const PHRASES = ['[synchronizing mind]', '[思维同步中]', '[心を同期中]', '[make me sad]'];
  let phraseIdx = 0;
  const phraseTimer = setInterval(() => {
    phraseIdx = (phraseIdx + 1) % PHRASES.length;
    statusEl.textContent = PHRASES[phraseIdx];
  }, 1200);

  document.getElementById('pet-menu').addEventListener('click', () => {
    if (window.pywebview?.api?.close) window.pywebview.api.close();
    else window.close();
  });

  // 从 query string 读取模型绝对路径
  // 例如：file:///.../live2d_page.html?model=file:///D:/.../amadeusV1.model3.json
  const params = new URLSearchParams(location.search);
  const injectedModelUrl = "__MODEL_URL__";
  let modelUrl = params.get('model') || injectedModelUrl;
  if (!modelUrl) {
    statusEl.textContent = 'ERROR: model path not specified in query string';
    throw new Error('model path not specified');
  }

  // 检查依赖
  if (typeof PIXI === 'undefined') {
    statusEl.textContent = 'ERROR: pixi.js 未加载（网络问题？）';
    throw new Error('PIXI undefined');
  }
  if (typeof PIXI.live2d === 'undefined') {
    statusEl.textContent = 'ERROR: pixi-live2d-display 未加载（网络问题？）';
    throw new Error('pixi-live2d-display undefined');
  }

  const app = new PIXI.Application({
    view: document.getElementById('canvas'),
    resizeTo: window,
    backgroundAlpha: 0,   // 透明背景
    antialias: true,
    preserveDrawingBuffer: true,
  });

  try {
    // autoInteract/autoUpdate 关闭（airi 同款）：库自带的指针焦点和自动更新
    // 会在渲染路径覆盖我们写入的眼/头参数，改由下方 ticker 显式控制更新顺序。
    const model = await PIXI.live2d.Live2DModel.from(modelUrl, {
      autoInteract: false,
      autoUpdate: false,
    });
    app.stage.addChild(model);

    // 居中并按窗口大小缩放
    function fitModel() {
      const s = Math.min(
        window.innerWidth / model.width,
        window.innerHeight / model.height
      ) * 0.95;
      model.scale.set(s);
      model.anchor.set(0.5, 0.5);
      model.x = window.innerWidth / 2;
      model.y = window.innerHeight / 2;
    }
    fitModel();
    window.addEventListener('resize', fitModel);

    const state = { angry: 0, blush: 0, smile: 0, sad: 0 };
    const target = { angry: 0, blush: 0, smile: 0, sad: 0 };
    let speaking = false;
    // 口型系统：mouthTarget 由音量驱动（setMouth），mouthState 平滑跟随。
    // 无音量数据时（mouthTarget 长时间为 0 但 speaking=true）回退随机噪声口型，
    // 避免"只有 TTS 开关没有音量"时嘴完全不动。
    let mouthTarget = 0;
    let mouthState = 0;
    let lastMouthAt = 0;

    // —— airi 动效系统（resources/amadeus-live2d-motion.js）——
    // 眨眼状态机 + 视线总控（跟随指针 / 空闲扫视 / 身体慢层）
    const autoBlink = AmadeusMotion.createAutoBlink();
    const gaze = AmadeusMotion.createGazeSystem();
    window.__amadeusGaze = gaze;   // 调试/测试入口

    // —— 动作（motion）系统 ——
    // 每个情绪对应一个短补间：在 duration 毫秒内对头部/身体参数做偏移，
    // 让 Kurisu 不只眨眼，还会歪头、点头、低头、前倾等，更像真人。
    // 肢体动作（叉腰/抱胸/扶额/摊手/托腮）驱动手臂参数：
    //   Param6  = Arms Thinking Movement（手臂思考动作）
    //   Param7  = Arms Movement Physics（手臂动作物理）
    //   Param4  = Arm Physics（手臂物理）
    // 数值幅度未经模型规范确认，取保守值 ±20-30，可目测微调。
    const activeMotions = [];
    const MOTION_DURATIONS = {
      neutral: 1500, smile: 1200, blush: 1700, angry: 1100, sad: 1900, thinking: 1600,
      hands_on_hips: 1800, arms_crossed: 1800, facepalm: 1600, shrug: 1400, chin_rest: 2000,
    };
    const MOTIONS = {
      // 歪头疑问
      neutral: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('ParamAngleZ', 6 * w);
        core.setParameterValueById('ParamAngleX', -2 * w);
      },
      // 开心点头
      smile: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('ParamAngleX', 4 * w);
        core.setParameterValueById('ParamBodyAngleX', 2 * w);
      },
      // 害羞别过脸
      blush: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('ParamAngleY', -13 * w);
        core.setParameterValueById('ParamAngleX', -4 * w);
        core.setParameterValueById('ParamAngleZ', -4 * w);
      },
      // 生气前倾 + 微抖
      angry: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('ParamAngleX', 8 * w);
        core.setParameterValueById('ParamBodyAngleX', 4 * w);
        core.setParameterValueById('ParamAngleZ', 2.5 * Math.sin(t * Math.PI * 7) * (1 - t));
      },
      // 难过低头
      sad: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('ParamAngleX', -9 * w);
        core.setParameterValueById('ParamBodyAngleX', -3 * w);
      },
      // 思考：左右歪头 + 眼睛扫视
      thinking: (core, t) => {
        core.setParameterValueById('ParamAngleZ', 10 * Math.sin(t * Math.PI * 2));
        core.setParameterValueById('ParamEyeBallX', 0.6 * Math.sin(t * Math.PI * 2));
      },
      // 叉腰：手臂张开撑腰（Param6/7 正方向 + 上身微侧）
      hands_on_hips: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('Param6', 24 * w);
        core.setParameterValueById('Param7', 22 * w);
        core.setParameterValueById('ParamBodyAngleZ', 4 * w);
        core.setParameterValueById('ParamAngleX', 2 * w);
      },
      // 抱胸：双臂交叉收拢（Param6/7 负方向 + 下巴微抬）
      arms_crossed: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('Param6', -20 * w);
        core.setParameterValueById('Param7', -26 * w);
        core.setParameterValueById('ParamAngleX', -3 * w);
        core.setParameterValueById('ParamBodyAngleX', -2 * w);
      },
      // 扶额：单臂抬至额前 + 低头（Param4 抬臂）
      facepalm: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('Param4', -24 * w);
        core.setParameterValueById('Param6', 14 * w);
        core.setParameterValueById('ParamAngleX', -7 * w);
        core.setParameterValueById('ParamAngleZ', 3 * w);
      },
      // 摊手耸肩：双臂外摊 + 肩部上耸（Param7 双向抖动）
      shrug: (core, t) => {
        const w = Math.sin(t * Math.PI);
        const j = Math.sin(t * Math.PI * 6) * 0.5;
        core.setParameterValueById('Param7', 18 * w + 4 * j);
        core.setParameterValueById('Param6', 12 * w);
        core.setParameterValueById('ParamAngleZ', -5 * w);
      },
      // 托腮：单手托下巴 + 歪头（思考姿态，Param6 抬臂）
      chin_rest: (core, t) => {
        const w = Math.sin(t * Math.PI);
        core.setParameterValueById('Param6', -16 * w);
        core.setParameterValueById('Param4', 20 * w);
        core.setParameterValueById('ParamAngleZ', 8 * w);
        core.setParameterValueById('ParamAngleX', -4 * w);
        core.setParameterValueById('ParamEyeBallY', -0.5 * w);
      },
    };

    function playMotion(name) {
      const apply = MOTIONS[name];
      if (!apply) return;
      const duration = MOTION_DURATIONS[name] || 1500;
      for (let i = activeMotions.length - 1; i >= 0; i--) {
        if (activeMotions[i].name === name) activeMotions.splice(i, 1);
      }
      activeMotions.push({ name, start: performance.now(), duration, apply });
    }

    app.ticker.add(() => {
      // dt 钳制到 100ms：防后台标签页回来后 dt 巨大导致眨眼/平滑跳变
      const dtMs = Math.min(app.ticker.deltaMS, 100);
      // 先驱动库内部更新（SDK 动作/物理/姿势/自带眨眼），再写我们的最终参数 ——
      // 保证眨眼/视线是每帧最后写入的值（airi 插件管线的 post/final 语义）
      model.internalModel.update(dtMs, performance.now());
      Object.keys(state).forEach(key => state[key] += (target[key] - state[key]) * 0.12);
      const core = model.internalModel.coreModel;
      const now = performance.now();

      // —— 自动眨眼（airi 状态机）——
      // 基础眼开度 = 表情压低后的值；眨眼在其上乘法调制（闭眼 75ms easeOutQuad、
      // 睁眼 150~300ms easeInQuad、间隔 3~8s 随机；眼睛近闭时自动跳过）
      const eyeBase = Math.max(0, Math.min(1, 1 - state.smile * 0.55 - state.sad * 0.35));
      const blink = autoBlink.update(dtMs, eyeBase, eyeBase);

      // 表情参数
      core.setParameterValueById('Param8', state.angry);
      core.setParameterValueById('Param9', state.blush);
      core.setParameterValueById('ParamEyeRSmile', state.smile);
      core.setParameterValueById('ParamEyeROpen', blink.eyeROpen);
      core.setParameterValueById('ParamEyeLOpen', blink.eyeLOpen);

      // —— 视线系统（airi）——
      // 指针移动 → FocusController 平滑跟随；静止超 1s → 释放回空闲扫视
      const g = gaze.update(now, dtMs);
      core.setParameterValueById('ParamAngleX', g.headX * 18);
      core.setParameterValueById('ParamAngleY', g.headY * 12);
      core.setParameterValueById('ParamEyeBallX', g.eyeX);
      core.setParameterValueById('ParamEyeBallY', g.eyeY);

      // 待机呼吸 + 身体直连视线控制器（airi updateFocus 语义）
      const breath = Math.sin(now / 2200 * Math.PI * 2);
      core.setParameterValueById('ParamBodyAngleX', breath * 1.5 + g.bodyX * 10);
      core.setParameterValueById('ParamBodyAngleY', g.bodyY * 10);
      core.setParameterValueById('ParamBodyAngleZ', Math.cos(now / 2600 * Math.PI * 2) * 1.0);

      // 播放中的动作（在基础值之后叠加，动作期间覆盖对应参数）
      for (let i = activeMotions.length - 1; i >= 0; i--) {
        const m = activeMotions[i];
        const t = (now - m.start) / m.duration;
        if (t >= 1) { activeMotions.splice(i, 1); continue; }
        m.apply(core, t);
      }

      // 说话口型：音量驱动优先（setMouth 每 ~50ms 更新 mouthTarget），
      // 音量信号超 400ms 未更新且仍 speaking 时回退低频音节节奏噪声；
      // mouthState 平滑跟随 mouthTarget，防口型抽搐。
      if (speaking) {
        if (now - lastMouthAt > 400) {
          const rhythm = 0.5 + 0.5 * Math.sin(now / 240 * Math.PI * 2);
          mouthTarget = Math.max(0.25, 0.2 + 0.5 * rhythm + Math.random() * 0.15);
        }
      } else {
        mouthTarget = 0;
      }
      mouthState += (mouthTarget - mouthState) * 0.28;
      core.setParameterValueById('ParamMouthOpenY', 0.06 + mouthState * 0.65);
    });
    window.addEventListener('mousemove', event => {
      const px = Math.max(-1, Math.min(1, event.clientX / innerWidth * 2 - 1));
      const py = Math.max(-1, Math.min(1, event.clientY / innerHeight * 2 - 1));
      gaze.setPointer(px, py);
    });
    window.__amadeus = {
      model, app,
      setEmotion(emotion) {
        Object.keys(target).forEach(key => target[key] = 0);
        if (emotion in target) target[emotion] = emotion === 'smile' ? 0.75 : 0.85;
        playMotion(emotion);
      },
      setSpeaking(value) {
        speaking = Boolean(value);
        if (!speaking) mouthTarget = 0;
      },
      setMouth(intensity) {
        // 音量强度 → 口型目标：clamp 0-1，并刷新"最近音量"时间戳
        mouthTarget = Math.max(0, Math.min(1, Number(intensity) || 0));
        lastMouthAt = performance.now();
      },
      setPointer(x, y) {
        // 外部（ipc pointer 命令）驱动的视线目标
        gaze.setPointer(Number(x) || 0, Number(y) || 0);
      },
      playMotion,
    };

    statusEl.textContent = 'OK';
    clearInterval(phraseTimer);
    document.title = 'KURISU_READY';
    setTimeout(() => statusEl.style.display = 'none', 1500);

    // ?debug：常驻状态读数（跟踪/空闲、头/眼参数、眼开度），用于动效调试
    if (params.get('debug')) {
      statusEl.style.display = '';
      setInterval(() => {
        statusEl.textContent = [
          gaze._state().tracking ? 'TRACK' : 'IDLE',
          'head=' + model.internalModel.coreModel.getParameterValueById('ParamAngleX').toFixed(1) + ',' + model.internalModel.coreModel.getParameterValueById('ParamAngleY').toFixed(1),
          'eye=' + model.internalModel.coreModel.getParameterValueById('ParamEyeBallX').toFixed(2) + ',' + model.internalModel.coreModel.getParameterValueById('ParamEyeBallY').toFixed(2),
          'eyeL=' + model.internalModel.coreModel.getParameterValueById('ParamEyeLOpen').toFixed(2),
        ].join(' ');
      }, 250);
    }
  } catch (e) {
    clearInterval(phraseTimer);
    statusEl.textContent = 'ERROR: 模型加载失败 ' + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Amadeus Phone Live2D</title>
<script src="../resources/amadeus-live2d-host.js"></script>
<link rel="stylesheet" href="../resources/amadeus-live2d-phone.css">
</head>
<body>
<div id="status">Loading...</div>
<button id="pet-menu" title="关闭桌宠">×</button>
<div id="enter-flash"></div>

<div id="app">
  <div class="phone">
    <div class="screen">
      <div class="stage">
        <canvas id="canvas"></canvas>
      </div>
    </div>
    <div class="speaker"></div>
    <div class="home-btn" id="homeBtn" title="最小化到托盘"></div>
    <div class="side left-1"></div>
    <div class="side left-2"></div>
    <div class="side right-1"></div>
  </div>
</div>

<script src="../resources/live2dcubismcore.min.js"></script>
<script src="../resources/pixi.min.js"></script>
<script src="../resources/pixi-unsafe-eval.min.js"></script>
<script src="../resources/cubism4.min.js"></script>
<script src="../resources/html2canvas.min.js"></script>
<script src="../resources/amadeus-live2d-motion.js"></script>

<script src="../resources/amadeus-live2d-runtime.js"></script>

</html>
